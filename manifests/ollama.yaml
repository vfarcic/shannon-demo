apiVersion: apps/v1
kind: Deployment
metadata: { name: ollama, namespace: dot-ai, labels: { app: ollama } }
spec:
  replicas: 1
  selector: { matchLabels: { app: ollama } }
  template:
    metadata: { labels: { app: ollama } }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports: [{ containerPort: 11434 }]
          env: [{ name: OLLAMA_HOST, value: "0.0.0.0:11434" }]
          readinessProbe: { httpGet: { path: /, port: 11434 }, initialDelaySeconds: 5, periodSeconds: 5 }
          resources: { requests: { cpu: "250m", memory: "512Mi" }, limits: { memory: "2Gi" } }
          volumeMounts: [{ name: models, mountPath: /root/.ollama }]
      volumes: [{ name: models, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: ollama, namespace: dot-ai }
spec:
  selector: { app: ollama }
  ports: [{ name: http, port: 11434, targetPort: 11434 }]
